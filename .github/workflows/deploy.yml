name: Deploy to Cloudflare

# Runs `npm run deploy` on every push to main. It can also be started by hand from the
# GitHub mobile app or website: Actions -> Deploy to Cloudflare -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cloudflare access check
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API=https://api.cloudflare.com/client/v4
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          FILTER='{success, errors: [.errors[]? | {code, message}], status: .result.status}'
          {
            echo "secrets present: token=$([ -n "$CLOUDFLARE_API_TOKEN" ] && echo yes || echo NO) account_id=$([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo yes || echo NO) account_id_length=${#CLOUDFLARE_ACCOUNT_ID}"
            echo "account-token verify: $(curl -s -H "$H" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -c "$FILTER")"
            echo "user-token verify: $(curl -s -H "$H" "$API/user/tokens/verify" | jq -c "$FILTER")"
            echo "accounts visible: $(curl -s -H "$H" "$API/accounts" | jq -c '{success, names: [.result[]? | .name]}')"
            echo "workers in that account: $(curl -s -H "$H" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | jq -c '{success, errors: [.errors[]? | {code, message}], names: [.result[]? | .id]}')"
            echo "this worker lookup: $(curl -s -H "$H" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/knoxified-dashboard" | jq -c '{success, errors: [.errors[]? | {code, message}]}')"
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt
          echo "::notice title=Cloudflare access check::$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/diag.txt)"

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
